[package]
name = "rustmind"
version = "0.2.1"
edition = "2024"
description = "A CLI game inspired by the Mastermind® game"
readme = "../README.md"
repository = "https://github.com/jaenyf/rustmind"
license-file = "LICENSE"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
rustmind-core = { version = "0.1.0", path = "../rustmind-core" }
