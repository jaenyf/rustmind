[package]
name = "rustmind"
version = "0.2.0"
edition = "2024"
description = "A CLI game inspired by the Mastermind® game"
repository = "https://github.com/jaenyf/rustmind"
license = "GPL-3.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
rand = "0.10.3"

[dev-dependencies]
rstest = "0.28.0"
